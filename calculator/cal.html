<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>
<body>
    <div class="main">
        <div class="out">7744</div>
        <div class="up">
            <div>C</div>
            <div>+/-</div>
            <div>%</div>
            <div id="yellow">÷</div>
        </div>
        <div class="up2">
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div id="yellow">x</div>
        </div>
        <div class="up3">
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div id="yellow">-</div>
        </div>
        <div class="up4">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div id="yellow">+</div>
        </div>
        <div class="up5">
            <div id="zero">0</div>
            <div>,</div>
            <div id="yellow">=</div>
        </div>
    </div>
    
</body>
</html>
